<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Fitness Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .response-box {
            margin-top: 25px;
            background: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Fitness Chatbot</h1>

        <textarea
            id="query"
            placeholder="Ask your fitness question here..."></textarea>

        <button onclick="sendQuery()">
            Ask AI
        </button>

        <div class="response-box" id="response">

            AI response will appear here...

        </div>

    </div>

    <script>

        async function sendQuery() {

            const query =
                document.getElementById("query").value;

            const responseBox =
                document.getElementById("response");

            responseBox.innerHTML = "Loading...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            query: query
                        })
                    }
                );

                const data = await response.json();

                responseBox.innerHTML =
                    JSON.stringify(data, null, 2);

            }

            catch (error) {

                responseBox.innerHTML =
                    "Error: " + error;

            }

        }

    </script>

</body>

</html>
